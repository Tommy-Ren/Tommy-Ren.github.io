"254" font-size="24" fill="#c9adff" font-family="'Courier New', monospace" >$ repo-match match</text><rect x="354" y="236" width="12" height="25" rx="0" fill="#c6a9f9" /></g><rect x="60" y="533" width="272" height="96" rx="16" fill="url(#panel)" stroke="#34343d" /><text x="80" y="565" font-size="12" fill="#9990ac" font-family="'Courier New', monospace" letter-spacing="1.8">FETCH</text><text x="80" y="598" font-size="17" fill="#d5cddd" >Repository context</text><line x1="334" y1="580" x2="362" y2="580" stroke="#8b769f" stroke-width="2"/><path d="M357 576 l5 4 -5 4" fill="none" stroke="#8b769f"/><rect x="365" y="533" width="272" height="96" rx="16" fill="url(#panel)" stroke="#34343d" /><text x="385" y="565" font-size="12" fill="#9990ac" font-family="'Courier New', monospace" letter-spacing="1.8">SUMMARIZE</text><text x="385" y="598" font-size="17" fill="#d5cddd" >Project understanding</text><line x1="639" y1="580" x2="667" y2="580" stroke="#8b769f" stroke-width="2"/><path d="M662 576 l5 4 -5 4" fill="none" stroke="#8b769f"/><rect x="670" y="533" width="272" height="96" rx="16" fill="url(#panel)" stroke="#34343d" /><text x="690" y="565" font-size="12" fill="#c8b0fa" font-family="'Courier New', monospace" letter-spacing="1.8">MATCH</text><text x="690" y="598" font-size="17" fill="#d5cddd" >Relevant candidates</text><text x="36" y="694" font-size="11" fill="#686672" font-family="'Courier New', monospace" letter-spacing="2">PROJECT ILLUSTRATION</text><text x="964" y="694" font-size="10" fill="#686672" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="1.3">TOMMY REN / SELECTED WORK</text></g>
