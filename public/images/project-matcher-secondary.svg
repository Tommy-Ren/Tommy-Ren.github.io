<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" role="img" aria-labelledby="title desc">
<title id="title">Repo Matcher context and discovery diagram</title><desc id="desc">Conceptual diagram of context feeding repository understanding and candidate discovery. Three numbered stages describe the workflow and are not ranking scores or recommendations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".48" stop-color="#070709"/><stop offset="1" stop-color="#0c0a13"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a1a21"/><stop offset="1" stop-color="#0c0c10"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f5f3fa"/><stop offset=".28" stop-color="#bebbc9"/><stop offset=".65" stop-color="#686574"/><stop offset="1" stop-color="#302d3b"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#d5c8ff"/><stop offset=".3" stop-color="#ac96ec"/><stop offset=".7" stop-color="#6550a6"/><stop offset="1" stop-color="#292037"/></linearGradient>
  <radialGradient id="orb" cx=".3" cy=".25" r=".85"><stop stop-color="#faf7ff"/><stop offset=".21" stop-color="#ccc5de"/><stop offset=".59" stop-color="#8e809f"/><stop offset=".85" stop-color="#423647"/><stop offset="1" stop-color="#141118"/></radialGradient>
  <radialGradient id="purpleOrb" cx=".28" cy=".2" r=".9"><stop stop-color="#e3d6ff"/><stop offset=".24" stop-color="#bba3f6"/><stop offset=".55" stop-color="#7862af"/><stop offset=".83" stop-color="#3b2e5c"/><stop offset="1" stop-color="#191421"/></radialGradient>
  <radialGradient id="glow"><stop stop-color="#a998f5" stop-opacity=".28"/><stop offset="1" stop-color="#9984f2" stop-opacity="0"/></radialGradient>
  <radialGradient id="shade" cx=".2" cy=".22" r=".9"><stop offset=".2" stop-color="#080609" stop-opacity="0"/><stop offset=".6" stop-color="#09070d" stop-opacity=".15"/><stop offset=".9" stop-color="#050306" stop-opacity=".77"/><stop offset="1" stop-color="#030204" stop-opacity=".98"/></radialGradient>
  <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a897e9" stop-opacity=".25"/><stop offset="1" stop-color="#a897e9" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="700" height="600" rx="0" fill="url(#bg)" /><circle cx="360" cy="300" r="340" fill="url(#glow)" /><text x="36" y="53" font-size="12" fill="#b6a5e7" font-family="'Courier New', monospace" letter-spacing="2">FROM REPOSITORY TO DIRECTION</text><text x="36" y="97" font-size="27" fill="#e1d9eb" font-weight="500">Make the next step clearer.</text><rect x="36" y="132" width="230" height="356" rx="20" fill="url(#panel)" stroke="#34343d" /><text x="58" y="167" font-size="12" fill="#b7acc8" font-family="'Courier New', monospace" letter-spacing="1.5">YOUR CONTEXT</text><text x="58" y="216" font-size="10" fill="#71687e" font-family="'Courier New', monospace" letter-spacing="1.2">LANGUAGES</text><text x="58" y="243" font-size="14" fill="#b7adc6" >Python · TypeScript</text><line x1="58" y1="261" x2="244" y2="261" stroke="#2c2734" /><text x="58" y="302" font-size="10" fill="#71687e" font-family="'Courier New', monospace" letter-spacing="1.2">INTERESTS</text><text x="58" y="329" font-size="14" fill="#b7adc6" >Tools · Data · AI</text><line x1="58" y1="347" x2="244" y2="347" stroke="#2c2734" /><text x="58" y="388" font-size="10" fill="#71687e" font-family="'Courier New', monospace" letter-spacing="1.2">INTENT</text><text x="58" y="415" font-size="14" fill="#b7adc6" >Explore contributions</text><path d="M276 308 H313 V204 H338 M313 308 H338 M313 308 V411 H338" fill="none" stroke="#77608c" stroke-width="1.5"/><circle cx="313" cy="308" r="4" fill="#c2a0ef" /><rect x="338" y="157" width="326" height="89" rx="15" fill="url(#panel)" stroke="#34343d" /><text x="356" y="186" font-size="10" fill="#655876" font-family="'Courier New', monospace" >01</text><text x="356" y="213" font-size="17" fill="#c4b8d2" >Repository context</text><rect x="580" y="177" width="64" height="6" rx="3" fill="#2f263b" /><rect x="580" y="190" width="44" height="6" rx="3" fill="#2f263b" /><rect x="338" y="261" width="326" height="89" rx="15" fill="url(#panel)" stroke="#34343d" /><text x="356" y="290" font-size="10" fill="#655876" font-family="'Courier New', monospace" >02</text><text x="356" y="317" font-size="17" fill="#c4b8d2" >Project understanding</text><rect x="580" y="281" width="64" height="6" rx="3" fill="#2f263b" /><rect x="580" y="294" width="44" height="6" rx="3" fill="#2f263b" /><rect x="338" y="365" width="326" height="89" rx="15" fill="url(#panel)" stroke="#34343d" /><text x="356" y="394" font-size="10" fill="#655876" font-family="'Courier New', monospace" >03</text><text x="356" y="421" font-size="17" fill="#d4bcfa" >Candidate discovery</text><rect x="580" y="385" width="64" height="6" rx="3" fill="#2f263b" /><rect x="580" y="398" width="44" height="6" rx="3" fill="#2f263b" /><text x="36" y="535" font-size="12" fill="#8b7f9b" font-family="'Courier New', monospace" >A conceptual matching flow; no fabricated scores.</text><text x="36" y="574" font-size="11" fill="#686672" font-family="'Courier New', monospace" letter-spacing="2">PROJECT ILLUSTRATION</text><text x="664" y="574" font-size="10" fill="#686672" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="1.3">TOMMY REN / SELECTED WORK</text></g>
</svg>
