#bcaccb" font-family="'Courier New', monospace" letter-spacing="1.6">TEXTURE RECIPE</text><text x="55" y="164" font-size="12" fill="#766782" font-family="'Courier New', monospace" >Base</text><text x="290" y="164" font-size="13" fill="#bca8cb" text-anchor="end">Fractal noise</text><text x="55" y="203" font-size="12" fill="#766782" font-family="'Courier New', monospace" >Layers</text><text x="290" y="203" font-size="13" fill="#bca8cb" text-anchor="end">Banded surface</text><text x="55" y="242" font-size="12" fill="#766782" font-family="'Courier New', monospace" >Palette</text><text x="290" y="242" font-size="13" fill="#bca8cb" text-anchor="end">Violet / dust</text><text x="55" y="281" font-size="12" fill="#766782" font-family="'Courier New', monospace" >Seed</text><text x="290" y="281" font-size="13" fill="#bca8cb" text-anchor="end">Reproducible</text><text x="55" y="320" font-size="12" fill="#766782" font-family="'Courier New', monospace" >Export</text><text x="290" y="320" font-size="13" fill="#bca8cb" text-anchor="end">2D texture</text><text x="36" y="404" font-size="11" fill="#686672" font-family="'Courier New', monospace" letter-spacing="2">INTERFACE STUDY</text><text x="664" y="404" font-size="10" fill="#686672" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="1.3">TOMMY REN / SELECTED WORK</text></g>
