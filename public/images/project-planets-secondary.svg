50" cy="240" r="350" fill="url(#glow)" /><text x="36" y="53" font-size="12" fill="#b69acc" font-family="'Courier New', monospace" letter-spacing="1.7">SAME PROCESS. DIFFERENT WORLDS.</text><text x="36" y="96" font-size="27" fill="#ddd1e8" font-weight="500">Texture is the starting point.</text><rect x="36" y="126" width="628" height="200" rx="18" fill="url(#panel)" stroke="#34343d" /><text x="58" y="160" font-size="11" fill="#ab90bd" font-family="'Courier New', monospace" letter-spacing="1.8">SEEDED 2D SURFACE</text><defs><clipPath id="texture-map"><rect x="58" y="179" width="584" height="123" rx="10" fill="#fff" /></clipPath></defs><g clip-path="url(#texture-map)"><rect x="37" y="160" width="625" height="166" rx="0" fill="url(#planetBands)" filter="url(#planetTexture)"/><rect x="58" y="179" width="584" height="123" rx="0" fill="transparent" filter="url(#surfaceNoise)"/></g><defs><clipPath id="planet-small-a"><circle cx="140" cy="432" r="69" fill="#fff" /></clipPath></defs><g clip-path="url(#planet-small-a)"><rect x="36" y="328" width="208" height="208" rx="0" fill="url(#planetBands)" filter="url(#planetTexture)"/><circle cx="140" cy="432" r="69" fill="transparent" filter="url(#surfaceNoise)"/><circle cx="140" cy="432" r="69" fill="url(#shade)" /></g><circle cx="140" cy="432" r="69" fill="none" stroke="#d8c7e9" stroke-opacity=".16"/><defs><clipPath id="planet-small-b"><circle cx="350" cy="432" r="69" fill="#fff" /></clipPath></defs><g clip-path="url(#planet-small-b)"><rect x="246" y="328" width="208" height="208" rx="0" fill="url(#planetBands)" filter="url(#planetTexture)"/><circle cx="350" cy="432" r="69" fill="transparent" filter="url(#surfaceNoise)"/><circle cx="350" cy="432" r="69" fill="url(#shade)" /></g><circle cx="350" cy="432" r="69" fill="none" stroke="#d8c7e9" stroke-opacity=".16"/><defs><clipPath id="planet-small-c"><circle cx="560" cy="432" r="69" fill="#fff" /></clipPath></defs><g clip-path="url(#planet-small-c)"><rect x="456" y="328" width="208" height