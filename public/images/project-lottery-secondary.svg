<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" role="img" aria-labelledby="title desc">
<title id="title">Lottery probability illustration</title><desc id="desc">An illustrative number distribution and feature diagram for a virtual Canadian lottery simulator. The chart is decorative and does not represent measured usage or official results.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".48" stop-color="#070709"/><stop offset="1" stop-color="#0c0a13"/></linearGradient>
