<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
<title id="title">Repo Matcher terminal interface study</title><desc id="desc">Original interface study of the three repo-match commands: fetch, summarize, and match. Supplemental labels describe their conceptual purpose rather than inventing application output.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".48" stop-color="#070709"/><stop offset="1" stop-color="#0c0a13"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a1a21"/><stop offset="1" stop-color="#0c0c10"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f5f3fa"/><stop offset=".28" stop-color="#bebbc9"/><stop offset=".65" stop-color="#686574"/><stop offset="1" stop-color="#302d3b"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#d5c8ff"/><stop offset=".3" stop-color="#ac96ec"/><stop offset=".7" stop-color="#6550a6"/><stop offset="1" stop-color="#292037"/></linearGradient>
  <radialGradient id="orb" cx=".3" cy=".25" r=".85"><stop stop-color="#faf7ff"/><stop offset=".21" stop-color="#ccc5de"/><stop offset=".59" stop-color="#8e809f"/><stop offset=".85" stop-color="#423647"/><stop offset="1" stop-color="#141118"/></radialGradient>
  <radialGradient id="purpleOrb" cx=".28" cy=".2" r=".9"><stop stop-color="#e3d6ff"/><stop offset=".24" stop-color="#bba3f6"/><stop offset=".55" stop-color="#7862af"/><stop offset=".83" stop-color="#3b2e5c"/><stop offset="1" stop-color="#191421"/></radialGradient>
  <radialGradient id="glow"><stop stop-color="#a998f5" stop-opacity=".28"/><stop offset="1" stop-color="#9984f2" stop-opacity="0"/></radialGradient>
  <radialGradient id="shade" cx=".2" cy=".22" r=".9"><stop offset=".2" stop-color="#080609" stop-opacity="0"/><stop offset=".6" stop-color="#09070d" stop-opacity=".15"/><stop offset=".9" stop-color="#050306" stop-opacity=".77"/><stop offset="1" stop-color="#030204" stop-opacity=".98"/></radialGradient>
  <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a897e9" stop-opacity=".25"/><stop offset="1" stop-color="#a897e9" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="700" height="430" rx="0" fill="url(#bg)" /><circle cx="470" cy="220" r="300" fill="url(#glow)" /><text x="34" y="46" font-size="12" fill="#b7a4e7" font-family="'Courier New', monospace" letter-spacing="2">CONTEXT IN. RELEVANCE OUT.</text><rect x="32" y="70" width="636" height="294" rx="18" fill="url(#panel)" stroke="#34343d" /><circle cx="52" cy="91" r="4" fill="#575560" /><circle cx="67" cy="91" r="4" fill="#575560" /><circle cx="82" cy="91" r="4" fill="#b6a4f1" /><text x="646" y="95" font-size="10" fill="#706780" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="1.5">COMMAND FLOW</text><line x1="32" y1="111" x2="668" y2="111" stroke="#29292f" /><text x="55" y="157" font-size="20" fill="#726486" font-family="'Courier New', monospace" >$</text><text x="81" y="157" font-size="20" fill="#d6cede" font-family="'Courier New', monospace" >repo-match fetch</text><text x="632" y="157" font-size="12" fill="#8b8297" text-anchor="end">Source context</text><line x1="54" y1="183" x2="645" y2="183" stroke="#26222d" /><text x="55" y="229" font-size="20" fill="#726486" font-family="'Courier New', monospace" >$</text><text x="81" y="229" font-size="20" fill="#d6cede" font-family="'Courier New', monospace" >repo-match summarize</text><text x="632" y="229" font-size="12" fill="#8b8297" text-anchor="end">Structured understanding</text><line x1="54" y1="255" x2="645" y2="255" stroke="#26222d" /><text x="55" y="301" font-size="20" fill="#726486" font-family="'Courier New', monospace" >$</text><text x="81" y="301" font-size="20" fill="#c6aaf7" font-family="'Courier New', monospace" >repo-match match</text><text x="632" y="301" font-size="12" fill="#8b8297" text-anchor="end">Candidate discovery</text><text x="36" y="404" font-size="11" fill="#686672" font-family="'Courier New', monospace" letter-spacing="2">INTERFACE STUDY</text><text x="664" y="404" font-size="10" fill="#686672" font-family="'Courier New', monospace" text-anchor="end" letter-spacing="1.3">TOMMY REN / SELECTED WORK</text></g>
</svg>
