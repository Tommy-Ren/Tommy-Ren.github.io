<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Procedural planet texture illustration</title><desc id="desc">Original SVG artwork depicting a banded planet with orbital rings and a recipe selector. The actual project generates seeded two-dimensional planet textures; the depicted sphere is an illustration, not an implemented live 3D renderer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".48" stop-color="#070709"/><stop offset="1" stop-color="#0c0a13"/></linearGradient>
